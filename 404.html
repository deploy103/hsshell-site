<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>페이지를 찾을 수 없습니다 | HS Shell</title>

    <style media="screen">
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; padding: 32px 20px; display: grid; place-items: center; background: linear-gradient(135deg, #1a1a2e, #0f0f1e 50%, #16213e); color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
      #message { width: 100%; max-width: 520px; }
      .brand { color: #4facfe; font-size: 28px; font-weight: bold; letter-spacing: 2px; }
      .error-code { margin: 32px 0 8px; color: #4facfe; font-weight: bold; }
      h1 { margin: 0 0 20px; font-size: clamp(28px, 5vw, 40px); line-height: 1.4; word-break: keep-all; }
      .description { color: #ccc; line-height: 1.8; }
      a { display: inline-block; margin-top: 16px; padding: 16px 28px; border-radius: 50px; background: linear-gradient(135deg, #4facfe, #00f2fe); color: #0a0a0a; font-weight: bold; text-decoration: none; }
      a:focus-visible { outline: 3px solid #fff; outline-offset: 5px; }
    </style>
  </head>
  <body>
    <main id="message">
      <div class="brand">HS Shell</div>
      <p class="error-code">404</p>
      <h1>페이지를 찾을 수 없습니다.</h1>
      <p class="description">주소가 잘못되었거나 페이지가 이동되었을 수 있습니다. 홈에서 동아리 소개와 커리큘럼을 확인해 주세요.</p>
      <a href="/">HS Shell 홈으로</a>
    </main>
  </body>
</html>
